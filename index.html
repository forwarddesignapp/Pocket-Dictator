<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pocket Pirates</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    h1 { margin-bottom: 5px; color: #f59e0b; text-shadow: 2px 2px #000; }
    #stats-bar { display: flex; gap: 20px; background: #1e293b; padding: 12px 24px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; font-weight: bold; }
    .gold { color: #fbbf24; }
    
    /* Layout Utama */
    #game-container { display: flex; gap: 20px; width: 1000px; }
    canvas { background: #0284c7; border-radius: 8px; border: 4px solid #0369a1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    
    /* Panel Rekrutmen Kru */
    #crew-panel { background: #1e293b; padding: 15px; border-radius: 8px; width: 300px; border: 1px solid #334155; }
    .crew-card { background: #334155; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .crew-info h4 { margin: 0; color: #38bdf8; }
    .crew-info p { margin: 3px 0 0 0; font-size: 0.8rem; color: #cbd5e1; }
    button.btn-buy { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.btn-buy:disabled { background: #64748b; cursor: not-allowed; }
    
    .hired-slot { background: #0f172a; border: 1px dashed #475569; padding: 8px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

  <h1>🏴‍☠️ POCKET PIRATES</h1>
  
  <div id="stats-bar">
    <div>Kapal: <span style="color: #38bdf8;">Sloop Sederhana</span></div>
    <div>Gold: <span id="gold-display" class="gold">50</span> 💰</div>
    <div>Slot Kru: <span id="slot-display">0</span> / 3</div>
  </div>

  <div id="game-container">
    <!-- Canvas Laut tempat Kapal Berlayar -->
    <canvas id="oceanCanvas" width="650" height="450"></canvas>

    <!-- Panel Kedai / Tavern Rekrutmen -->
    <div id="crew-panel">
      <h3>⚓ Kedai Rekrutmen</h3>
      <div id="crew-list"></div>
      
      <h3>📋 Kru Aktif</h3>
      <div id="active-crew">
        <div class="hired-slot">Kosong</div>
        <div class="hired-slot">Kosong</div>
        <div class="hired-slot">Kosong</div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
