<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Pirates - Strategic Nautical RPG</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&display=swap');
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .bg-ocean { background-color: #0c192c; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }
        .animate-ship { animation: floatSlow 3.5s ease-in-out infinite; }
    </style>
</head>
<body className="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SAVE_KEY = 'pocket_pirates_v2_save';
        const MAP_BOUNDS = { width: 800, height: 600 };

        // STARTER TRADITIONAL SHIPS WITH UNIQUE BUFFS
        const STARTER_SHIPS = [
            {
                id: 'jung',
                name: 'Nusantara Junk (Jung)',
                origin: 'Southeast Asia',
                icon: '⛵',
                description: 'Sturdy multi-layered wooden hull designed for spice trade and endurance in archipelago waters.',
                buff: 'Hull Resistance +20%, Fishing Gain +25%',
                baseHull: 120,
                baseCannons: 2,
            },
            {
                id: 'atakebune',
                name: 'East Asian Atakebune',
                origin: 'East Asia',
                icon: '🏯',
                description: 'Iron-clad floating fortress with heavy defensive timber and high siege capability.',
                buff: 'Cannon Firepower +15%, Accuracy +10%',
                baseHull: 110,
                baseCannons: 3,
            },
            {
                id: 'caravel',
                name: 'European Caravel',
                origin: 'Europe',
                icon: '🧭',
                description: 'Light, fast-sailing ship with triangular lateen sails ideal for long-distance discovery.',
                buff: 'Travel Speed +20%, Food Consumption -15%',
                baseHull: 90,
                baseCannons: 2,
            },
            {
                id: 'dhow',
                name: 'Afro-Arabian Dhow (Sambuk)',
                origin: 'Africa & Arabia',
                icon: '🌊',
                description: 'Highly agile vessel equipped with lateen sails, mastering monsoon wind currents.',
                buff: 'Flee Success +25%, Base Morale +15%',
                baseHull: 95,
                baseCannons: 2,
            }
        ];

        const FLAGS = [
            { id: 'flag1', name: 'Golden Skull', symbol: '☠️', color: 'bg-amber-600' },
            { id: 'flag2', name: 'Sultanate Crescent', symbol: '🌙', color: 'bg-emerald-600' },
            { id: 'flag3', name: 'Dragon Crest', symbol: '🐉', color: 'bg-red-600' },
            { id: 'flag4', name: 'Kraken Tentacle', symbol: '🐙', color: 'bg-purple-600' }
        ];

        const SPECIALISTS_INFO = [
            { id: 'helmsman', title: 'Helmsman', cost: 120, advice: "Wind is picking up! Keep our bow into the waves to maintain 15% speed.", role: "Navigation" },
            { id: 'navigator', title: 'Navigator', cost: 150, advice: "Squall spotted 12 nautical miles north. We can bypass it using current charts.", role: "Cartography" },
            { id: 'lookout', title: 'Lookout', cost: 100, advice: "Ship ahoy on the horizon! Looks like a merchant trader carrying rum.", role: "Scouting" },
            { id: 'cook', title: 'Ship Cook', cost: 110, advice: "I salted the fish inventory. Food supplies will last 25% longer now, Captain!", role: "Catering" },
            { id: 'quartermaster', title: 'Quartermaster', cost: 180, advice: "Morale is holding steady. Discipline is maintained among the deck crew.", role: "Discipline" },
            { id: 'shipwright', title: 'Shipwright', cost: 160, advice: "Hull timber patched! I'm using spare wood to auto-repair minor leaks.", role: "Maintenance" },
            { id: 'master_gunner', title: 'Master Gunner', cost: 200, advice: "Cannons loaded with chain shot! Accuracy calibrated at +15%.", role: "Artillery" }
        ];

        const TROOPS_INFO = [
            { id: 'swordsman', name: 'Swordsman', cost: 15, power: 5, role: 'Melee / Boarder' },
            { id: 'musketeer', name: 'Musketeer', cost: 30, power: 8, role: 'Ranged Sharpshooter' },
            { id: 'grenadier', name: 'Grenadier', cost: 50, power: 14, role: 'Demolition Specialist' },
            { id: 'brute', name: 'Brute Berserker', cost: 90, power: 22, role: 'Frontline Vanguard' }
        ];

        const WORLD_NODES = [
            { id: 1, name: "Siren Reef Isle", type: "island", x: 120, y: 150, powerReq: 80, loot: { gold: 150, wood: 50 } },
            { id: 2, name: "East India Merchant", type: "ship", x: 450, y: 180, powerReq: 160, loot: { gold: 350, rum: 30 } },
            { id: 3, name: "Fortified Kraal", type: "fort", x: 680, y: 420, powerReq: 380, loot: { gold: 900, gunpowder: 80 } },
            { id: 4, name: "Leviathan Lair", type: "monster", x: 220, y: 480, powerReq: 260, loot: { gold: 600, food: 120 } },
            { id: 5, name: "Floating Black Market", type: "event", x: 720, y: 120, powerReq: 100, loot: { gold: 200, wood: 80 } }
        ];

        function PocketPiratesApp() {
            // STATE MANAGEMENT
            const [profile, setProfile] = useState(null); // Account creation
            const [activeView, setActiveView] = useState('deck'); // 'deck' | 'tactical' | 'world'
            const [resources, setResources] = useState({ gold: 600, wood: 250, food: 120, rum: 60, gunpowder: 40 });
            const [shipState, setShipState] = useState({ level: 1, hullHp: 100, maxHullHp: 100, cannons: 2 });
            const [morale, setMorale] = useState(85);
            const [hiredSpecialists, setHiredSpecialists] = useState([]);
            const [troops, setTroops] = useState({ swordsman: 3, musketeer: 1, grenadier: 0, brute: 0 });
            const [logs, setLogs] = useState(["Welcome to Pocket Pirates! Set sail and command the sea."]);
            
            // Map Movement State (World View)
            const [shipPos, setShipPos] = useState({ x: 300, y: 300 });
            const [targetDestination, setTargetDestination] = useState(null);
            const [isNavigating, setIsNavigating] = useState(false);
            const [selectedEncounter, setSelectedEncounter] = useState(null);

            // ONBOARDING FORM STATE
            const [formName, setFormName] = useState('Sultanate Fleet');
            const [formFlag, setFormFlag] = useState(FLAGS[0]);
            const [formShip, setFormShip] = useState(STARTER_SHIPS[0]);

            // LOAD & AUTO-SAVE
            useEffect(() => {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.profile) {
                            setProfile(parsed.profile);
                            setResources(parsed.resources);
                            setShipState(parsed.shipState);
                            setMorale(parsed.morale);
                            setHiredSpecialists(parsed.hiredSpecialists);
                            setTroops(parsed.troops);
                            setShipPos(parsed.shipPos || { x: 300, y: 300 });
                        }
                    } catch(e) { console.error("Save load error", e); }
                }
            }, []);

            useEffect(() => {
                if (profile) {
                    localStorage.setItem(SAVE_KEY, JSON.stringify({
                        profile, resources, shipState, morale, hiredSpecialists, troops, shipPos
                    }));
                }
            }, [profile, resources, shipState, morale, hiredSpecialists, troops, shipPos]);

            const addLog = (msg) => {
                setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 15)]);
            };

            // POWER LEVEL CALCULATION
            const totalTroops = Object.values(troops).reduce((a, b) => a + b, 0);
            const troopPower = (troops.swordsman * 5) + (troops.musketeer * 8) + (troops.grenadier * 14) + (troops.brute * 22);
            const powerLevel = Math.floor((shipState.level * 30) + (shipState.cannons * 25) + troopPower + (hiredSpecialists.length * 20));

            // ONBOARDING COMPLETION
            const handleCreateFleet = () => {
                if (!formName.trim()) return;
                const newProfile = {
                    fleetName: formName,
                    flag: formFlag,
                    starterShip: formShip
                };
                setProfile(newProfile);
                setShipState(s => ({
                    ...s,
                    hullHp: formShip.baseHull,
                    maxHullHp: formShip.baseHull,
                    cannons: formShip.baseCannons
                }));
                addLog(`Fleet "${formName}" established! Flag ship ${formShip.name} ready for adventure.`);
            };

            // WORLD MAP MOVEMENT & GLOBE WRAPPER
            const handleMapClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                setTargetDestination({ x: clickX, y: clickY });
                setIsNavigating(true);
                addLog(`Course plotted to X:${Math.round(clickX)} Y:${Math.round(clickY)}. Waypoint locked.`);
            };

            // TICK TICK NAVIGATION & SPHERICAL OCEAN WRAP
            useEffect(() => {
                if (!isNavigating || !targetDestination) return;

                const timer = setInterval(() => {
                    setShipPos(prev => {
                        const dx = targetDestination.x - prev.x;
                        const dy = targetDestination.y - prev.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 4) {
                            setIsNavigating(false);
                            setTargetDestination(null);
                            addLog("Destination reached, Captain.");
                            return prev;
                        }

                        const speed = 2.5;
                        let nextX = prev.x + (dx / dist) * speed;
                        let nextY = prev.y + (dy / dist) * speed;

                        // Globe Wrapping logic (X boundary wraps around)
                        if (nextX > MAP_BOUNDS.width) nextX = 0;
                        if (nextX < 0) nextX = MAP_BOUNDS.width;

                        // Check proximity to world encounters (auto-triggers Tactical Close View)
                        WORLD_NODES.forEach(node => {
                            const closeDist = Math.hypot(node.x - nextX, node.y - nextY);
                            if (closeDist < 35) {
                                setSelectedEncounter(node);
                                setActiveView('tactical');
                                setIsNavigating(false);
                                addLog(`Encounter detected near ${node.name}! Engaging Tactical View.`);
                            }
                        });

                        return { x: nextX, y: nextY };
                    });
                }, 100);

                return () => clearInterval(timer);
            }, [isNavigating, targetDestination]);

            // BATTLE RESOLUTION
            const handleBattleAction = (type) => {
                if (!selectedEncounter) return;
                const enc = selectedEncounter;
                let winRate = Math.min(95, Math.max(15, Math.floor((powerLevel / enc.powerReq) * 60)));

                if (type === 'bombard') winRate += 10;
                if (type === 'board') winRate += 15;

                const success = Math.random() * 100 <= winRate;
                if (success) {
                    setResources(r => ({ ...r, gold: r.gold + enc.loot.gold, wood: r.wood + (enc.loot.wood || 0) }));
                    setMorale(m => Math.min(100, m + 8));
                    addLog(`VICTORY! Defeated ${enc.name}. Claimed +${enc.loot.gold} Gold.`);
                } else {
                    const dmg = Math.floor(Math.random() * 20) + 10;
                    setShipState(s => ({ ...s, hullHp: Math.max(0, s.hullHp - dmg) }));
                    setMorale(m => Math.max(0, m - 12));
                    addLog(`DEFEAT! Suffered -${dmg} Hull Damage against ${enc.name}.`);
                }
                setSelectedEncounter(null);
                setActiveView('deck');
            };

            const handleFishing = () => {
                addLog("Casting fishing nets...");
                setTimeout(() => {
                    const bonus = profile?.starterShip?.id === 'jung' ? 1.25 : 1;
                    const caught = Math.floor((Math.random() * 12 + 8) * bonus);
                    setResources(r => ({ ...r, food: r.food + caught }));
                    addLog(`FISHING SUCCESS: Caught +${caught} fresh fish food.`);
                }, 1200);
            };

            // ONBOARDING UI IF NO PROFILE
            if (!profile) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                        <div className="max-w-2xl w-full bg-slate-900 border-2 border-amber-500/50 rounded-2xl p-6 shadow-2xl space-y-6">
                            <div className="text-center space-y-2">
                                <h1 className="text-2xl font-bold text-amber-400 font-pixel tracking-wider">POCKET PIRATES</h1>
                                <p className="text-xs text-slate-400">Establish your naval dynasty, choose your traditional vessel, and conquer the open seas.</p>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-300 mb-1">Fleet / Nation Name</label>
                                    <input 
                                        type="text"
                                        value={formName}
                                        onChange={e => setFormName(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-300 focus:outline-none focus:border-amber-500"
                                        placeholder="e.g. Sultanate Fleet"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-300 mb-2">Select Pirate Flag Insignia</label>
                                    <div className="grid grid-cols-4 gap-2">
                                        {FLAGS.map(f => (
                                            <button
                                                key={f.id}
                                                onClick={() => setFormFlag(f)}
                                                className={`p-3 rounded-lg border text-center transition flex flex-col items-center gap-1 ${
                                                    formFlag.id === f.id ? 'border-amber-400 bg-amber-500/10' : 'border-slate-800 bg-slate-950 hover:border-slate-700'
                                                }`}
                                            >
                                                <span className="text-xl">{f.symbol}</span>
                                                <span className="text-[10px] text-slate-300 font-medium">{f.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-300 mb-2">Select Starting Traditional Vessel</label>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {STARTER_SHIPS.map(s => (
                                            <button
                                                key={s.id}
                                                onClick={() => setFormShip(s)}
                                                className={`p-3 rounded-xl border text-left transition flex flex-col justify-between ${
                                                    formShip.id === s.id ? 'border-amber-400 bg-amber-500/10' : 'border-slate-800 bg-slate-950 hover:border-slate-700'
                                                }`}
                                            >
                                                <div>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="font-bold text-xs text-amber-300">{s.icon} {s.name}</span>
                                                        <span className="text-[9px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">{s.origin}</span>
                                                    </div>
                                                    <p className="text-[10px] text-slate-400 mb-2 leading-tight">{s.description}</p>
                                                </div>
                                                <div className="text-[9px] font-bold text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 p-1.5 rounded">
                                                    ✨ Buff: {s.buff}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={handleCreateFleet}
                                className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition text-sm font-pixel"
                            >
                                SET SAIL CAPTAIN ⚓
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
                    {/* TOP STATUS HEADER */}
                    <header className="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2">
                            <div className="flex items-center space-x-3">
                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-lg ${profile.flag.color}`}>
                                    {profile.flag.symbol}
                                </div>
                                <div>
                                    <h1 className="font-bold text-xs text-amber-400">{profile.fleetName}</h1>
                                    <div className="text-[10px] text-slate-400">{profile.starterShip.name} • Level {shipState.level}</div>
                                </div>
                                <div className="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-[10px] text-amber-300 font-mono">
                                    ⚔️ Power: {powerLevel}
                                </div>
                            </div>

                            {/* RESOURCES BAR */}
                            <div className="flex items-center gap-2 text-[11px] font-semibold">
                                <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">🪙 {resources.gold}</span>
                                <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">🪵 {resources.wood}</span>
                                <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">🍖 {resources.food}</span>
                                <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">🍾 {resources.rum}</span>
                                <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">😊 {morale}%</span>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT WORKSPACE VIEW */}
                    <main className="max-w-6xl mx-auto w-full flex-grow p-3 flex flex-col gap-4">
                        
                        {/* VIEW 1: SHIP DECK VIEW */}
                        {activeView === 'deck' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-4">
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                        <h2 className="font-bold text-xs uppercase text-amber-400 tracking-wider">⛵ Ship Deck & Vessel Management</h2>
                                        <button onClick={handleFishing} className="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1 rounded-lg font-bold">
                                            🎣 Fish Food
                                        </button>
                                    </div>

                                    {/* ANIMATED SHIP DISPLAY */}
                                    <div className="h-48 bg-gradient-to-b from-sky-950 via-slate-900 to-slate-950 rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden">
                                        <div className="absolute inset-x-0 bottom-0 h-10 bg-sky-900/30 border-t border-sky-800/50"></div>
                                        <div className="text-6xl animate-ship z-10 cursor-pointer" title={profile.starterShip.name}>
                                            {profile.starterShip.icon}
                                        </div>
                                    </div>

                                    {/* SPECIALIST ADVISOR FEEDBACK */}
                                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-3">
                                        <h3 className="text-xs font-bold text-amber-400 mb-2">🗣️ Specialist Crew Tactical Advice</h3>
                                        {hiredSpecialists.length === 0 ? (
                                            <p className="text-[11px] text-slate-500 italic">No specialist hired yet. Recruit crew members to receive active tactical advice!</p>
                                        ) : (
                                            <div className="space-y-2 max-h-32 overflow-y-auto pr-1">
                                                {hiredSpecialists.map(id => {
                                                    const spec = SPECIALISTS_INFO.find(s => s.id === id);
                                                    return (
                                                        <div key={id} className="bg-slate-900 p-2 rounded-lg border border-slate-800 text-xs">
                                                            <span className="font-bold text-amber-300">{spec.title}:</span> <span className="text-slate-300 text-[11px]">"{spec.advice}"</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* RIGHT PANEL: TROOPS & RECRUITMENT */}
                                <div className="space-y-4">
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <h3 className="font-bold text-xs text-amber-400 mb-3">🗡️ Combat Troop Roster</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            {TROOPS_INFO.map(t => (
                                                <div key={t.id} className="bg-slate-950 p-2 rounded-xl border border-slate-800">
                                                    <div className="flex justify-between text-xs font-bold">
                                                        <span>{t.name}</span>
                                                        <span className="text-amber-400">{troops[t.id]}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => {
                                                            if (resources.gold >= t.cost) {
                                                                setResources(r => ({ ...r, gold: r.gold - t.cost }));
                                                                setTroops(tr => ({ ...tr, [t.id]: tr[t.id] + 1 }));
                                                                addLog(`Recruited 1 ${t.name}`);
                                                            }
                                                        }}
                                                        className="mt-2 w-full bg-slate-800 hover:bg-slate-700 text-amber-300 text-[10px] font-bold py-1 rounded-lg border border-slate-700"
                                                    >
                                                        Recruit ({t.cost}G)
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <h3 className="font-bold text-xs text-amber-400 mb-3">👨‍✈️ Hire Specialists</h3>
                                        <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                            {SPECIALISTS_INFO.map(s => {
                                                const hired = hiredSpecialists.includes(s.id);
                                                return (
                                                    <div key={s.id} className="flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs">
                                                        <div>
                                                            <div className="font-bold text-slate-200">{s.title}</div>
                                                            <div className="text-[10px] text-slate-400">{s.role}</div>
                                                        </div>
                                                        <button
                                                            disabled={hired}
                                                            onClick={() => {
                                                                if (resources.gold >= s.cost) {
                                                                    setResources(r => ({ ...r, gold: r.gold - s.cost }));
                                                                    setHiredSpecialists(prev => [...prev, s.id]);
                                                                    addLog(`Hired specialist ${s.title}`);
                                                                }
                                                            }}
                                                            className={`px-2 py-1 rounded-lg text-[10px] font-bold ${
                                                                hired ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-600 hover:bg-amber-500 text-white'
                                                            }`}
                                                        >
                                                            {hired ? 'Hired' : `${s.cost}G`}
                                                        </button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 2: TACTICAL CLOSE-UP SEA VIEW */}
                        {activeView === 'tactical' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                                <h2 className="font-bold text-sm text-red-400 uppercase tracking-wider">⚔️ Tactical Close Engagement View</h2>
                                {selectedEncounter ? (
                                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-4">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-lg text-amber-300">{selectedEncounter.name}</h3>
                                                <p className="text-xs text-slate-400">Target Power: {selectedEncounter.powerReq} | Your Power: {powerLevel}</p>
                                            </div>
                                            <span className="bg-red-950 border border-red-800 text-red-400 text-xs px-2 py-1 rounded font-bold">Encounter</span>
                                        </div>

                                        <div className="grid grid-cols-3 gap-3">
                                            <button 
                                                onClick={() => handleBattleAction('bombard')}
                                                className="bg-red-600 hover:bg-red-500 text-white font-bold p-3 rounded-xl text-xs flex flex-col items-center gap-1 shadow"
                                            >
                                                <span>💣 Cannon Bombard</span>
                                                <span className="text-[10px] text-red-200">Heavy damage</span>
                                            </button>
                                            <button 
                                                onClick={() => handleBattleAction('board')}
                                                className="bg-amber-600 hover:bg-amber-500 text-white font-bold p-3 rounded-xl text-xs flex flex-col items-center gap-1 shadow"
                                            >
                                                <span>⚔️ Board Vessel</span>
                                                <span className="text-[10px] text-amber-200">Troop melee</span>
                                            </button>
                                            <button 
                                                onClick={() => { setActiveView('world'); setSelectedEncounter(null); }}
                                                className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold p-3 rounded-xl text-xs flex flex-col items-center gap-1"
                                            >
                                                <span>💨 Retreat / Flee</span>
                                                <span className="text-[10px] text-slate-400">Disengage</span>
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-8 text-slate-500 text-xs">
                                        No active close contact. Select an icon on the World Map to engage!
                                    </div>
                                )}
                            </div>
                        )}

                        {/* VIEW 3: GLOBAL OCEAN WORLD MAP VIEW (SPHERICAL WRAP) */}
                        {activeView === 'world' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold text-xs text-amber-400 uppercase tracking-wider">🗺️ Spherical World Map (Click to Navigate)</h2>
                                    <span className="text-[10px] text-slate-400">East-West bounds loop spherical globe</span>
                                </div>

                                <div 
                                    onClick={handleMapClick}
                                    className="relative w-full h-[400px] bg-ocean border-2 border-slate-800 rounded-xl overflow-hidden cursor-crosshair shadow-inner"
                                >
                                    {/* MAP GRID LINES */}
                                    <div className="absolute inset-0 opacity-10 bg-[linear-gradient(to_right,#38bdf8_1px,transparent_1px),linear-gradient(to_bottom,#38bdf8_1px,transparent_1px)] [background-size:32px_32px]"></div>

                                    {/* DASHED TRAJECTORY LINE TO TARGET */}
                                    {targetDestination && (
                                        <svg className="absolute inset-0 w-full h-full pointer-events-none">
                                            <line 
                                                x1={shipPos.x} 
                                                y1={shipPos.y} 
                                                x2={targetDestination.x} 
                                                y2={targetDestination.y} 
                                                stroke="#f59e0b" 
                                                strokeWidth="2" 
                                                strokeDasharray="6,6"
                                            />
                                        </svg>
                                    )}

                                    {/* PLAYER SHIP ICON */}
                                    <div 
                                        className="absolute transform -translate-x-1/2 -translate-y-1/2 text-2xl transition-all duration-75"
                                        style={{ left: `${shipPos.x}px`, top: `${shipPos.y}px` }}
                                    >
                                        ⛵
                                    </div>

                                    {/* WORLD NODES */}
                                    {WORLD_NODES.map(node => (
                                        <div
                                            key={node.id}
                                            className="absolute transform -translate-x-1/2 -translate-y-1/2 p-2 rounded-full border border-amber-500/50 bg-slate-900/80 text-xs flex items-center justify-center shadow-lg"
                                            style={{ left: `${node.x}px`, top: `${node.y}px` }}
                                            title={node.name}
                                        >
                                            {node.type === 'island' ? '🏝️' : node.type === 'ship' ? '⛵' : node.type === 'fort' ? '🏰' : '🐙'}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* LOGS PANEL AT BOTTOM */}
                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 h-32 flex flex-col">
                            <h3 className="font-bold text-[10px] uppercase text-slate-400 mb-1">📜 Captain's Journal & Event Logs</h3>
                            <div className="flex-grow overflow-y-auto font-mono text-[11px] text-slate-300 space-y-1 pr-1">
                                {logs.map((log, i) => (
                                    <div key={i} className="border-b border-slate-800/40 pb-0.5">{log}</div>
                                ))}
                            </div>
                        </div>

                    </main>

                    {/* BOTTOM NAVIGATION BAR */}
                    <nav className="bg-slate-900 border-t border-slate-800 p-2 sticky bottom-0 z-50">
                        <div className="max-w-md mx-auto grid grid-cols-3 gap-2">
                            <button 
                                onClick={() => setActiveView('deck')}
                                className={`py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                                    activeView === 'deck' ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                }`}
                            >
                                ⛵ Ship Deck
                            </button>
                            <button 
                                onClick={() => setActiveView('tactical')}
                                className={`py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                                    activeView === 'tactical' ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                }`}
                            >
                                ⚔️ Tactical View
                            </button>
                            <button 
                                onClick={() => setActiveView('world')}
                                className={`py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                                    activeView === 'world' ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                }`}
                            >
                                🗺️ World Map
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<PocketPiratesApp />);
    </script>
</body>
</html>
